<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linvau — Live links from your Obsidian vault</title>
  <meta name="description" content="Share once. Update forever. Live links from your Obsidian vault.">
  <style>
    :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --accent:#6d28d9; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#fafaf9; --muted:#a8a29e; --accent:#a78bfa; } }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px;
           background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,sans-serif; }
    main { max-width:560px; text-align:center; }
    h1 { font-size:clamp(2.2rem,6vw,3.2rem); letter-spacing:-.02em; }
    .tag { color:var(--accent); font-weight:600; margin:.5rem 0 1.25rem; }
    p { color:var(--muted); }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Linvau</h1>
    <p class="tag">Share once. Update forever.</p>
    <p>Live links from your Obsidian vault. Coming in 2027.</p>
    <p style="margin-top:2rem">Contact: <a href="mailto:info@linvau.com">info@linvau.com</a></p>
  </main>
</body>
</html>
